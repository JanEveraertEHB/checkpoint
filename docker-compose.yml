
services:

  api:
    build:
      context: ./images/api
      dockerfile: Dockerfile.dev
    image: crshlab/api:latest
    container_name: "api"
    ports:
      - 3000:3000
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      TOKEN_ENCRYPTION: ${TOKEN_ENCRYPTION}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - ./images/api/src:/usr/app/src
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  teacher:
    build:
      context: ./images/teacher
      dockerfile: Dockerfile.dev
    container_name: teacher
    ports:
      - 5173:5173
    volumes:
      - ./images/teacher/src:/app/src
      - ./images/teacher/public:/app/public
      - ./images/teacher/index.html:/app/index.html
      - ./images/teacher/vite.config.ts:/app/vite.config.ts
      - ./images/teacher/tsconfig.json:/app/tsconfig.json
      - ./images/teacher/tsconfig.app.json:/app/tsconfig.app.json
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
    networks:
      - backend
    restart: unless-stopped

  student:
    build:
      context: ./images/student
      dockerfile: Dockerfile.dev
    container_name: student
    ports:
      - 5174:5173
    volumes:
      - ./images/student/src:/app/src
      - ./images/student/public:/app/public
      - ./images/student/index.html:/app/index.html
      - ./images/student/vite.config.ts:/app/vite.config.ts
      - ./images/student/tsconfig.json:/app/tsconfig.json
      - ./images/student/tsconfig.app.json:/app/tsconfig.app.json
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
    networks:
      - backend
    restart: unless-stopped

  db:
    image: "postgres:latest"
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./_volumes/pg:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DATABASE} -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5


networks:
  backend:
    driver: bridge
